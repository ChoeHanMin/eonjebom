name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    # main 에 올라간 코드만, 테스트를 통과하면 배포한다.
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # 토큰을 아직 등록하지 않았으면 실패 대신 안내만 남기고 배포를 건너뛴다.
      - name: Check FLY_API_TOKEN
        id: token
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::notice::배포를 건너뜁니다. 저장소 Settings > Secrets and variables > Actions 에 FLY_API_TOKEN 을 등록하면 배포돼요."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.token.outputs.ok == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master

      # 처음 한 번만: 앱과 데이터 볼륨을 만든다. (이미 있으면 건너뜀)
      - name: Create app and volume if missing
        if: steps.token.outputs.ok == 'true'
        run: |
          APP=$(sed -n 's/^app = "\(.*\)"/\1/p' fly.toml)
          REGION=$(sed -n 's/^primary_region = "\([a-z]*\)".*/\1/p' fly.toml)
          if ! flyctl status --app "$APP" > /dev/null 2>&1; then
            echo "앱 $APP 생성"
            flyctl apps create "$APP" --org personal
          fi
          if ! flyctl volumes list --app "$APP" --json | grep -q '"eonjebom_data"'; then
            echo "볼륨 생성"
            flyctl volumes create eonjebom_data --app "$APP" --region "$REGION" --size 1 --yes
          fi

      - name: Deploy
        if: steps.token.outputs.ok == 'true'
        run: flyctl deploy --remote-only --ha=false
